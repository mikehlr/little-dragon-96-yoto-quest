  <title>Little Dragon ’96 · Yoto Quest — Family Arcade 2.3</title>
  <meta name="description" content="An illustrated arcade adventure for one or two players. Full controller support, HD environments and cinematic atmosphere.">

<body>
  <main id="game-shell">
    <canvas id="game" width="1920" height="1080" aria-label="Little Dragon ’96 — πεδίο παιχνιδιού"></canvas>
    <button id="pause" class="utility" type="button" aria-label="Παύση" hidden>Ⅱ</button>
    <button id="enable-audio" type="button" hidden>ΕΝΕΡΓΟΠΟΙΗΣΗ ΗΧΟΥ</button>
    <div id="touch" hidden>
      <div class="direction">
        <button data-key="up" aria-label="Πάνω">▲</button>
        <button data-key="left" aria-label="Αριστερά">◀</button>
        <button data-key="down" aria-label="Κάτω">▼</button>
        <button data-key="right" aria-label="Δεξιά">▶</button>
      </div>
      <div class="actions">
        <button data-key="punch" aria-label="Γροθιά">👊</button>
        <button data-key="kick" aria-label="Κλωτσιά">🦶</button>
        <button data-key="block" aria-label="Άμυνα">🛡</button>
        <button data-key="jump" aria-label="Άλμα">↥</button>
        <button data-key="special" aria-label="Ενέργεια">✦</button>
        <button data-key="pickup" aria-label="Σήκωμα ή ρίψη αντικειμένου">↗</button>
        <button data-key="dodge" aria-label="Αποφυγή">↯</button>
      </div>
    </div>
    <section id="screen" aria-label="Μενού παιχνιδιού"><div id="panel"></div></section>
  </main>
